<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" sizes:"64x64" href="images/favicon.png">
  <link rel="icon" type="image/png" sizes:"48x48" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>Sebastijan Pečenko | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="Sebastijan Pečenko Logo">
        </a>
      <ul class="nav-links">
        <li><a href="about.html">About me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="heros">
  <div class="heros-content">
    <h1 class="heros-title">Get in Touch</h1>
    <p class="heros-description">
      Whether you have a question, a project idea, or just want to say hi, feel free to drop a message below or reach out directly!
    </p>
    <div class="contact-container">
      <!-- Obrazec za pošiljanje -->
      <!-- Opomba: Z uporabo Formspree (brezplačno) lahko sporočila dobiš naravnost na svoj email -->
      <form action="https://formspree.io/f/tvoj-form-id" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message <i class="fa-solid fa-paper-plane"></i></button>
      </form>

      <div class="contact-info">
        <div class="info-item">
          <i class="fa-solid fa-envelope info-icon"></i>
          <div>
            <h3>Email</h3>
            <a href="mailto:pecenkosebastijan@gmail.com">pecenkosebastijan@gmail.com</a>
          </div>
        </div>
        <div class="info-item">
          <i class="fa-brands fa-github info-icon"></i>
          <div>
            <h3>GitHub</h3>
            <a href="https://github.com/SebastijanPecenko" target="_blank" rel="noopener noreferrer">github.com/SebastijanPecenko</a>
          </div>
        </div>
        <div class="info-item">
          <i class="fa-solid fa-location-dot info-icon"></i>
          <div>
            <h3>Location</h3>
            <p>Slovenia</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

  <footer>
    <div class="social-icons">
      <a href="mailto:pecenkosebastijan@gmail.com" aria-label="Send Email">
        <i class="fa-solid fa-envelope"></i>
      </a>
      <a href="https://github.com/SebastijanPecenko" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
    <p class="footer-text">
      &#169; 2026, Sebastijan Pečenko.
    </p>
  </footer>
</body>
</html>
